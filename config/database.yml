default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["DATABASE_USER"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV["DATABASE_HOST"] %>

development:
  <<: *default
  database: roadpass_development

test:
  <<: *default
  database: roadpass_test

production:
  <<: *default
  database: roadpass_production
  password: <%= ENV["ROADPASS_API_DATABASE_PASSWORD"] %>
